<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDOR Clinic</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
  <meta name="referrer" content="no-referrer">

  <script src="./js/preferences.js"></script>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./favicon.ico">
  <meta name="description" content="Learn IDOR and object-level authorization with three fictional browser-only scenarios. Compare VULN and SECURE policies; simulated requests stay in memory.">
</head>
<body>
  <header class="container app-header">
    <div class="header-left">
      <h1 class="title">IDOR Clinic</h1>
      <p class="subtitle" data-i18n="subtitle">IDORとオブジェクト単位の認可を学ぶ、ブラウザー内のシミュレーター</p>
    </div>
    <div class="header-actions">
      <div id="modeIndicator"></div>
      <label class="mode-select"><span data-i18n="mode">モード</span>
        <select id="mode">
          <option>VULN</option>
          <option>SECURE</option>
        </select>
      </label>
      <div id="loginBox"></div>
      <label class="language-select"><span data-i18n="language">言語</span>
        <select id="language"><option value="ja">日本語</option><option value="en">English</option></select>
      </label>
      <button id="themeToggle" class="theme-toggle-header" title="テーマ切り替え">☀️</button>
    </div>
  </header>
  <p class="container small" id="storageNote" hidden></p>

  <nav class="container nav">
    <a href="#/" data-i18n="home">ホーム</a>
    <a href="#/app" data-i18n="app">実験</a>
    <a href="#/compare" data-i18n="compare">比較</a>
    <a href="#/learn" data-i18n="learn">学習</a>
  </nav>

  <main class="container" id="app">
    <noscript>JavaScriptを有効にしてください。 / JavaScript is required.</noscript>
  </main>

  <section id="toast" class="toast" role="status" aria-live="polite"></section>

  <footer>
    <div class="footer">
      <span data-i18n="repo">GitHubリポジトリー</span>:
      <a href="https://github.com/ipusiron/idor-clinic" target="_blank" rel="noopener noreferrer">ipusiron/idor-clinic</a>
    </div>
  </footer>

  <script src="./js/core.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/messages.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
